# Publish to PyPI when a GitHub release is published, with PyPI trusted publishing:
# GitHub proves to PyPI that this workflow is running, so no token is stored anywhere.
# One-time setup on pypi.org: add a trusted publisher for this repository, workflow
# "publish.yml", environment "pypi".
name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
